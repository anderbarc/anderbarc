<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imagens para PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef0f3; --surface:#ffffff; --sunk:#e3e6eb; --ink:#1b1f27; --muted:#5d6573;
  --line:#cfd4dc; --accent:#d9480f; --accent-ink:#ffffff; --accent-soft:#fbe4d9;
  --ok:#2b8a3e; --err:#c92a2a;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --surface:#1d2128; --sunk:#252a33; --ink:#e7eaef; --muted:#9aa3b2;
    --line:#343a45; --accent:#ff7a3d; --accent-ink:#1b1f27; --accent-soft:#3a2418;
    --ok:#69db7c; --err:#ff8787; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --surface:#1d2128; --sunk:#252a33; --ink:#e7eaef; --muted:#9aa3b2;
  --line:#343a45; --accent:#ff7a3d; --accent-ink:#1b1f27; --accent-soft:#3a2418;
  --ok:#69db7c; --err:#ff8787; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:20px}
header h1{font-size:28px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.drop{border:2px dashed var(--line);background:var(--surface);border-radius:10px;padding:28px 20px;display:grid;justify-items:center;gap:10px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.drop strong{font-size:17px;font-weight:600}
.drop span{color:var(--muted);font-size:13px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.opt{display:grid;gap:6px}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--ink)}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.hint{font-size:12px;color:var(--muted)}
input[type=text]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;padding-top:6px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.stats{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:500;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.07)}
button:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;grid-template-rows:auto auto;position:relative}
.card.dragging{opacity:.4}
.card.target{outline:2px solid var(--accent)}
.thumb{aspect-ratio:3/4;background:var(--sunk);display:grid;place-items:center;overflow:hidden;cursor:grab}
.thumb img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.num{position:absolute;top:6px;left:6px;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px}
.tag{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.meta{padding:6px 8px;display:grid;gap:4px}
.name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.size{font-family:var(--mono);font-size:11px;color:var(--muted)}
.acts{display:flex;gap:4px}
.acts button{padding:2px 0;flex:1;font-size:13px;line-height:1.4}
.empty{color:var(--muted);text-align:center;padding:24px}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--accent);transition:width .15s}
.result{border-left:3px solid var(--ok);padding:10px 14px;background:var(--sunk);border-radius:0 8px 8px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.result.error{border-left-color:var(--err)}
.result p{margin:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Imagens para PDF</h1>
    <p>Junte fotos e digitalizações num PDF pequeno. Tudo acontece no seu navegador: as imagens não são enviadas para lugar nenhum.</p>
  </header>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" multiple>
    <strong>Escolha as imagens ou arraste para cá</strong>
    <span>JPG, PNG, WEBP, GIF · quantas quiser · a ordem pode ser ajustada depois</span>
  </label>

  <section class="panel" aria-label="Opções">
    <div class="opts">
      <div class="opt">
        <span class="label">Compressão</span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="q" id="q-max" value="max" checked><span>Máxima</span></label>
          <label><input type="radio" name="q" id="q-mid" value="mid"><span>Equilibrada</span></label>
          <label><input type="radio" name="q" id="q-hi" value="hi"><span>Alta qualidade</span></label>
        </div>
        <span class="hint" id="q-hint"></span>
      </div>
      <div class="opt">
        <span class="label">Página</span>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="pg" id="pg-a4" value="a4" checked><span>A4</span></label>
          <label><input type="radio" name="pg" id="pg-fit" value="fit"><span>Tamanho da imagem</span></label>
        </div>
        <span class="hint">A4 gira a página sozinho quando a imagem é deitada.</span>
      </div>
      <div class="opt">
        <label class="label" for="fname">Nome do arquivo</label>
        <input type="text" id="fname" value="documento">
        <label class="check"><input type="checkbox" id="gray"> Preto e branco (reduz mais)</label>
      </div>
    </div>
  </section>

  <section class="panel" aria-label="Páginas">
    <div class="bar">
      <div class="stats" id="stats"></div>
      <div class="btns">
        <button id="clear" type="button">Limpar</button>
        <button id="make" class="primary" type="button">Gerar PDF</button>
      </div>
    </div>
    <div class="progress" id="prog" hidden><div></div></div>
    <div id="result" hidden></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
  const PRESETS = {
    max: { dim: 1500, q: 0.55, hint: "Menor arquivo. Ótimo para documentos e envio por e-mail/WhatsApp." },
    mid: { dim: 2000, q: 0.7,  hint: "Bom meio-termo entre tamanho e nitidez." },
    hi:  { dim: 2800, q: 0.85, hint: "Mais nítido, arquivo maior. Para fotos que vão ser impressas." }
  };
  const A4 = [595.28, 841.89];
  const $ = s => document.querySelector(s);
  const grid = $("#grid"), stats = $("#stats"), result = $("#result"), prog = $("#prog");
  let items = [];   // {id, name, size, url, source: File|Blob, example}
  let seq = 0;
  let lastUrl = null;

  const fmt = b => b < 1024 ? b + " B" : b < 1048576 ? (b/1024).toFixed(0) + " KB" : (b/1048576).toFixed(2) + " MB";
  const opt = name => document.querySelector(`input[name=${name}]:checked`).value;

  function updateHint(){ $("#q-hint").textContent = PRESETS[opt("q")].hint; }
  document.querySelectorAll("input[name=q]").forEach(r => r.addEventListener("change", updateHint));
  updateHint();

  function render(){
    grid.innerHTML = "";
    if (!items.length){
      grid.innerHTML = '<div class="empty">Nenhuma imagem ainda.</div>';
    }
    items.forEach((it, i) => {
      const c = document.createElement("div");
      c.className = "card"; c.draggable = true; c.dataset.id = it.id;
      c.innerHTML = `<div class="thumb"><img alt=""></div><span class="num">${i+1}</span>${it.example ? '<span class="tag">exemplo</span>' : ""}
        <div class="meta"><div class="name"></div><div class="size">${fmt(it.size)}</div>
        <div class="acts"><button type="button" data-a="l" aria-label="Mover para trás" ${i===0?"disabled":""}>←</button>
        <button type="button" data-a="r" aria-label="Mover para frente" ${i===items.length-1?"disabled":""}>→</button>
        <button type="button" data-a="x" aria-label="Remover">✕</button></div></div>`;
      c.querySelector("img").src = it.url;
      c.querySelector(".name").textContent = it.name;
      c.querySelector(".name").title = it.name;
      grid.appendChild(c);
    });
    const total = items.reduce((s, it) => s + it.size, 0);
    stats.innerHTML = `<b>${items.length}</b> ${items.length === 1 ? "página" : "páginas"} · originais <b>${fmt(total)}</b>`;
    $("#make").disabled = !items.length;
    $("#clear").disabled = !items.length;
  }

  function move(from, to){
    if (to < 0 || to >= items.length) return;
    const [x] = items.splice(from, 1); items.splice(to, 0, x); render();
  }

  grid.addEventListener("click", e => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const i = items.findIndex(it => it.id == b.closest(".card").dataset.id);
    if (b.dataset.a === "l") move(i, i-1);
    else if (b.dataset.a === "r") move(i, i+1);
    else { URL.revokeObjectURL(items[i].url); items.splice(i, 1); render(); }
  });

  // reorder by drag
  let dragId = null;
  grid.addEventListener("dragstart", e => {
    const c = e.target.closest(".card"); if (!c) return;
    dragId = c.dataset.id; c.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId);
  });
  grid.addEventListener("dragend", () => { dragId = null; grid.querySelectorAll(".card").forEach(c => c.classList.remove("dragging","target")); });
  grid.addEventListener("dragover", e => {
    if (dragId === null) return;
    const c = e.target.closest(".card"); e.preventDefault();
    grid.querySelectorAll(".target").forEach(t => t !== c && t.classList.remove("target"));
    if (c && c.dataset.id !== dragId) c.classList.add("target");
  });
  grid.addEventListener("drop", e => {
    if (dragId === null) return;
    e.preventDefault(); e.stopPropagation();
    const c = e.target.closest(".card"); if (!c) return;
    const from = items.findIndex(it => it.id == dragId), to = items.findIndex(it => it.id == c.dataset.id);
    move(from, to);
  });

  function addFiles(list){
    const files = [...list].filter(f => f.type.startsWith("image/") || /\.(jpe?g|png|webp|gif|bmp|avif|heic)$/i.test(f.name));
    if (!files.length) return;
    if (items.some(it => it.example)) { items.forEach(it => URL.revokeObjectURL(it.url)); items = items.filter(it => !it.example); }
    files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    for (const f of files) items.push({ id: ++seq, name: f.name, size: f.size, url: URL.createObjectURL(f), source: f });
    result.hidden = true;
    render();
  }

  $("#file").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
  const drop = $("#drop");
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { if (dragId !== null) return; e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove("over")));
  drop.addEventListener("drop", e => { if (dragId !== null) return; e.preventDefault(); addFiles(e.dataTransfer.files); });
  document.addEventListener("dragover", e => { if (dragId === null) e.preventDefault(); });
  document.addEventListener("drop", e => { if (dragId === null) { e.preventDefault(); addFiles(e.dataTransfer.files); } });
  document.addEventListener("paste", e => { if (e.clipboardData?.files?.length) addFiles(e.clipboardData.files); });

  $("#clear").addEventListener("click", () => { items.forEach(it => URL.revokeObjectURL(it.url)); items = []; result.hidden = true; render(); });

  async function decode(blob){
    try { return await createImageBitmap(blob, { imageOrientation: "from-image" }); }
    catch {
      const url = URL.createObjectURL(blob);
      try {
        const img = new Image(); img.src = url; await img.decode(); return img;
      } finally { URL.revokeObjectURL(url); }
    }
  }

  async function toJpeg(blob, preset, gray){
    const src = await decode(blob);
    const w0 = src.width, h0 = src.height;
    const s = Math.min(1, preset.dim / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * s)), h = Math.max(1, Math.round(h0 * s));
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);      // transparent PNGs get a white ground
    ctx.imageSmoothingQuality = "high";
    if (gray) ctx.filter = "grayscale(1)";
    ctx.drawImage(src, 0, 0, w, h);
    src.close?.();
    const out = await new Promise(r => cv.toBlob(r, "image/jpeg", preset.q));
    cv.width = cv.height = 0;
    return { bytes: new Uint8Array(await out.arrayBuffer()), w, h };
  }

  function pageFor(w, h, mode){
    if (mode === "a4"){
      const land = w > h;
      const [pw, ph] = land ? [A4[1], A4[0]] : A4;
      const s = Math.min(pw / w, ph / h);
      const iw = w * s, ih = h * s;
      return { pw, ph, x: (pw - iw) / 2, y: (ph - ih) / 2, iw, ih };
    }
    // page matches the image, scaled so the long side is A4-long
    const s = A4[1] / Math.max(w, h);
    const pw = w * s, ph = h * s;
    return { pw, ph, x: 0, y: 0, iw: pw, ih: ph };
  }

  function showResult(html, isError){
    result.className = "result" + (isError ? " error" : "");
    result.innerHTML = html; result.hidden = false;
  }

  let downloads = null;
  if (window.claude?.use) claude.use("downloads").then(d => { downloads = d; }).catch(() => {});

  async function save(blob, filename){
    if (downloads){
      try { await downloads.save({ filename, data: blob }); return "saved"; }
      catch (err) {
        if (err?.code === "declined") return "declined";
        if (err?.code === "rate_limited") return "busy";
      }
    }
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = lastUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    return "saved";
  }

  let built = null;
  $("#make").addEventListener("click", async () => {
    if (!items.length) return;
    const btn = $("#make"); btn.disabled = true; result.hidden = true;
    prog.hidden = false; const bar = prog.firstElementChild; bar.style.width = "0";
    const preset = PRESETS[opt("q")], mode = opt("pg"), gray = $("#gray").checked;
    try {
      const { jsPDF } = window.jspdf;
      let doc = null;
      for (let i = 0; i < items.length; i++){
        const j = await toJpeg(items[i].source, preset, gray);
        const p = pageFor(j.w, j.h, mode);
        const orient = p.pw > p.ph ? "l" : "p";
        if (!doc) doc = new jsPDF({ unit: "pt", format: [p.pw, p.ph], orientation: orient, compress: true });
        else doc.addPage([p.pw, p.ph], orient);
        doc.addImage(j.bytes, "JPEG", p.x, p.y, p.iw, p.ih, undefined, "NONE");
        bar.style.width = ((i + 1) / items.length * 100) + "%";
        await new Promise(r => setTimeout(r));
      }
      doc.setProperties({ title: $("#fname").value.trim() || "documento", creator: "Imagens para PDF" });
      const blob = doc.output("blob");
      const orig = items.reduce((s, it) => s + it.size, 0);
      const pct = orig ? Math.round((1 - blob.size / orig) * 100) : 0;
      const name = ($("#fname").value.trim() || "documento").replace(/[\\/:*?"<>|]+/g, "-").replace(/\.pdf$/i, "") + ".pdf";
      built = { blob, name };
      showResult(`<p>PDF pronto: <b>${items.length}</b> ${items.length === 1 ? "página" : "páginas"}, <b>${fmt(blob.size)}</b>${pct > 0 ? ` (${pct}% menor que as imagens originais)` : ""}.</p><button type="button" class="primary" id="dl">Baixar ${name.replace(/[<>&]/g, "")}</button>`);
      $("#dl").addEventListener("click", async () => {
        const r = await save(built.blob, built.name);
        if (r === "busy") showResult("<p>Já há um pedido de download aberto. Confirme ou feche-o e tente de novo.</p>", true);
      });
      $("#dl").click();
    } catch (err) {
      console.error(err);
      showResult(`<p>Não consegui ler uma das imagens. Formatos como HEIC (iPhone) nem sempre abrem no navegador: converta para JPG e tente de novo.</p>`, true);
    } finally {
      btn.disabled = false; prog.hidden = true;
    }
  });

  // example pages so the tool shows what it does before anything is added
  async function examples(){
    const specs = [["recibo.jpg", 900, 1300, "#f8f9fa", "Recibo"], ["contrato-p1.jpg", 1000, 1400, "#fff", "Contrato · pág. 1"], ["foto-quadro.jpg", 1400, 900, "#dfe7f1", "Foto do quadro"]];
    for (const [name, w, h, bg, label] of specs){
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      const c = cv.getContext("2d");
      c.fillStyle = bg; c.fillRect(0, 0, w, h);
      c.fillStyle = "#1b1f27"; c.font = "600 64px sans-serif"; c.fillText(label, 70, 140);
      c.fillStyle = "#9aa3b2";
      for (let y = 220; y < h - 80; y += 46) c.fillRect(70, y, (w - 140) * (0.55 + 0.45 * Math.abs(Math.sin(y))), 16);
      const b = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.9));
      if (items.some(it => !it.example)) return;
      items.push({ id: ++seq, name, size: b.size, url: URL.createObjectURL(b), source: b, example: true });
    }
    render();
  }
  render();
  examples();
})();
</script>
</body>
</html>
