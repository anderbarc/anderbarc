<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado de História 3º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --ink:#1d2622; --muted:#5a6660; --line:#d3dad6;
  --primary:#0f6e62; --primary-ink:#ffffff; --primary-soft:#d8efe9;
  --sun:#f2b705; --sun-soft:#fdf1c8;
  --easy:#2f8f46; --easy-soft:#dcf2e1; --mid:#b86e00; --mid-soft:#fbe9cc; --hard:#c2372f; --hard-soft:#f9dcd9;
  --ok:#2f8f46; --bad:#c2372f;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121816; --surface:#1a2320; --sunk:#232e2a; --ink:#e6eeea; --muted:#9aaaa3; --line:#33413c;
    --primary:#4cc2ad; --primary-ink:#0e1a17; --primary-soft:#1d3a34;
    --sun:#f5c842; --sun-soft:#3a3218;
    --easy:#6fd08a; --easy-soft:#1c3524; --mid:#f0a948; --mid-soft:#3a2c17; --hard:#ff8a80; --hard-soft:#3d201e;
    --ok:#6fd08a; --bad:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2320; --sunk:#232e2a; --ink:#e6eeea; --muted:#9aaaa3; --line:#33413c;
  --primary:#4cc2ad; --primary-ink:#0e1a17; --primary-soft:#1d3a34;
  --sun:#f5c842; --sun-soft:#3a3218;
  --easy:#6fd08a; --easy-soft:#1c3524; --mid:#f0a948; --mid-soft:#3a2c17; --hard:#ff8a80; --hard-soft:#3d201e;
  --ok:#6fd08a; --bad:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
.cover{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px;border-top:6px solid var(--primary)}
.cover .eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--primary)}
.cover h1{font-size:34px;font-weight:800}
.cover p{margin:0;color:var(--muted);max-width:65ch}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.fields label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.fields input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.tabs button,.tool{font:inherit;font-size:15px;font-weight:700;border-radius:999px;padding:8px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tabs .spacer{flex:1}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.section-title{display:flex;align-items:center;gap:10px;padding-top:10px}
.section-title h2{font-size:24px}
.section-title .num{font-family:var(--display);font-weight:800;background:var(--sun);color:#1d2622;border-radius:8px;padding:0 10px;font-size:20px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;break-inside:avoid}
.q.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.q.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qn{font-family:var(--display);font-weight:800;font-size:18px;background:var(--primary);color:var(--primary-ink);border-radius:8px;min-width:40px;text-align:center;padding:0 8px;font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;letter-spacing:.02em}
.chip.f{background:var(--easy-soft);color:var(--easy)}
.chip.m{background:var(--mid-soft);color:var(--mid)}
.chip.d{background:var(--hard-soft);color:var(--hard)}
.chip.t{background:var(--sunk);color:var(--muted)}
.apoio{background:var(--sun-soft);border-radius:8px;padding:10px 14px;font-size:16px}
.apoio b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.stem{margin:0;font-weight:700}
.opts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--primary)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.letter{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.opt:has(input:checked) .letter{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.opt:has(input:focus-visible){outline:3px solid var(--sun)}
.opt.is-correct{border-color:var(--ok);background:var(--easy-soft)}
.opt.is-correct .letter{border-color:var(--ok);color:var(--ok)}
.opt.is-wrong{border-color:var(--bad);background:var(--hard-soft)}
.done .opt{cursor:default}
textarea{font:inherit;width:100%;min-height:96px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical;
  background-image:repeating-linear-gradient(transparent 0 30px,var(--line) 30px 31px);background-attachment:local;line-height:31px;padding-top:0}
.expected{border-left:4px solid var(--primary);background:var(--primary-soft);border-radius:0 8px 8px 0;padding:8px 12px;font-size:15px}
.expected b{color:var(--primary)}
.feedback{font-size:14px;font-weight:700}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
.finish{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.score div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.score b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.score span{font-size:13px;color:var(--muted)}
.key{overflow-x:auto}
.key table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;background:var(--surface)}
.key th,.key td{border:1px solid var(--line);padding:6px 8px;text-align:left;font-size:15px;vertical-align:top}
.key th{background:var(--sunk);font-size:13px}
.key .ans{font-family:var(--display);font-weight:800;font-size:18px;color:var(--primary);text-align:center;width:48px}
.dist{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.dist span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.note{font-size:14px;color:var(--muted)}
.print-only{display:none}
@media print{
  body{background:#fff;color:#000;font-size:12pt;padding:0}
  .tabs,.finish,.tool,.no-print{display:none!important}
  .print-only{display:block}
  .q,.cover,.score div{border-color:#999;box-shadow:none!important}
  .opt{border:none;padding:2px 0}
  .opt.is-correct,.opt.is-wrong,.opt:has(input:checked){background:none}
  textarea{border:none;min-height:120px;background-image:repeating-linear-gradient(transparent 0 30px,#999 30px 31px)}
  .apoio{background:#f3f3f3}
  .pagebreak{break-before:page}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="cover">
    <span class="eyebrow">Ensino Fundamental · 3º ano · Volume 3</span>
    <h1>Simulado de História</h1>
    <p>Capítulo 5, História e cultura indígena, e capítulo 6, História e cultura africana. São 50 questões de múltipla escolha e 20 questões para responder por escrito.</p>
    <div class="fields">
      <label for="aluno">Nome<input id="aluno" type="text" autocomplete="off"></label>
      <label for="turma">Turma<input id="turma" type="text" autocomplete="off"></label>
      <label for="data">Data<input id="data" type="text" autocomplete="off" placeholder="__/__/____"></label>
    </div>
    <div class="legend">Dificuldade: <span class="chip f">Fácil</span><span class="chip m">Médio</span><span class="chip d">Difícil</span> <span id="versao" class="note"></span></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-prova" aria-selected="true">Prova</button>
    <button role="tab" id="tab-gabarito" aria-selected="false">Gabarito</button>
    <span class="spacer"></span>
    <button class="tool" id="shuffle" type="button" title="Sorteia de novo a posição das respostas certas">Nova versão</button>
    <button class="tool" id="print" type="button" hidden>Imprimir</button>
    <button class="tool" id="save" type="button" hidden>Baixar arquivo</button>
  </nav>

  <main id="prova"></main>
  <section id="gabarito" hidden></section>
</div>

<script id="app">
(() => {
const T = { ind: "Cultura indígena", afr: "Cultura africana" };
const D = { f: "Fácil", m: "Médio", d: "Difícil" };

/* ---------- 50 questões de múltipla escolha ----------
   c = alternativa correta, w = quatro alternativas erradas.
   A letra da correta é sorteada na hora de montar a prova. */
const MC = [
// ===== Capítulo 5: História e cultura indígena =====
{t:"ind",d:"f",apoio:"Os indígenas já habitavam o atual território brasileiro antes da chegada dos europeus.",
 q:"De acordo com o texto, quando os indígenas começaram a viver no território que hoje é o Brasil?",
 c:"Antes da chegada dos europeus.",
 w:["Depois que os portugueses construíram as cidades.","Junto com os africanos que foram trazidos de navio.","Só a partir do ano 2000.","Depois da construção dos engenhos de açúcar."]},
{t:"ind",d:"f",apoio:"Na Região Amazônica, muitos indígenas ainda constroem espaços coletivos de moradia. Nesses espaços, podem dormir, preparar alimentos e conversar.",
 q:"Como se chamam esses espaços coletivos de moradia?",
 c:"Malocas.",
 w:["Senzalas.","Quilombos.","Iglus.","Casas-grandes."]},
{t:"ind",d:"f",q:"Um conjunto de ocas ou malocas forma:",
 c:"uma aldeia indígena.",
 w:["um engenho de açúcar.","um reino africano.","uma senzala.","uma universidade."]},
{t:"ind",d:"f",q:"Observe a lista de materiais. Qual deles <u>NÃO</u> era usado pelos indígenas para construir suas moradias?",
 c:"Cimento.",
 w:["Bambu.","Folha de palmeira.","Madeira.","Palha."]},
{t:"ind",d:"m",q:"As malocas variam conforme a etnia indígena. Quanto ao formato, elas podem ser:",
 c:"retangulares ou circulares.",
 w:["somente quadradas, com vários andares.","feitas de gelo, em formato de iglu.","sempre triangulares, como pirâmides.","iguais em todas as etnias."]},
{t:"ind",d:"m",apoio:"As habitações indígenas podem ser de variados tamanhos e formas. As ocas do povo Xavante, em sua maioria, abrigam parentes de uma mesma família.",
 q:"Segundo o texto, quem mora nas ocas do povo Xavante?",
 c:"Parentes de uma mesma família.",
 w:["Apenas o cacique da aldeia.","Somente os animais de estimação.","Viajantes europeus.","Pessoas de várias cidades diferentes."]},
{t:"ind",d:"m",q:"Por que as moradias indígenas não são todas iguais?",
 c:"Porque dependem da cultura de cada etnia e dos recursos naturais disponíveis no local.",
 w:["Porque foram todas construídas pelos portugueses.","Porque cada família compra a sua casa em uma loja.","Porque os indígenas só usam cimento e tijolo.","Porque as moradias mudam de formato a cada ano."]},
{t:"ind",d:"f",q:"Na atividade do livro, você descobriu a palavra DESMATAMENTO. O que ela significa?",
 c:"Retirar a vegetação de um local.",
 w:["Plantar árvores em um local.","Construir ocas e malocas.","Limpar a água dos rios.","Cuidar dos animais da floresta."]},
{t:"ind",d:"f",q:"O ato de repor a vegetação de um local que foi desmatado é chamado de:",
 c:"reflorestamento.",
 w:["desmatamento.","queimada.","colonização.","escravização."]},
{t:"ind",d:"m",apoio:"Um exemplo de retirada de recursos da natureza foi a extração do pau-brasil, no período em que os portugueses chegaram a este território. A madeira era levada para a Europa.",
 q:"Para que era usada a madeira do pau-brasil na Europa?",
 c:"Para fazer móveis e tinta para roupas.",
 w:["Para construir ocas e malocas.","Para fazer tijolos de adobe.","Para produzir açúcar.","Para fazer canoas para os indígenas."]},
{t:"ind",d:"d",q:"Por que os europeus retiravam tanto pau-brasil das matas?",
 c:"Para gerar riquezas, pois os produtos feitos com ele eram valorizados e caros na Europa.",
 w:["Para ajudar os indígenas a construir suas aldeias.","Para fazer o reflorestamento das matas.","Porque a árvore atrapalhava o crescimento das cidades europeias.","Para alimentar os animais de estimação."]},
{t:"ind",d:"m",apoio:"O urucum é utilizado pelos indígenas de várias maneiras. A tinta feita dessa semente é conhecida como colorau.",
 q:"Para que os indígenas usam o urucum?",
 c:"Para pintura corporal, como protetor solar e para evitar picadas de insetos.",
 w:["Para construir o telhado das malocas.","Para fazer pontas de lança.","Para produzir açúcar nos engenhos.","Para acender o fogo nas aldeias."]},
{t:"ind",d:"f",q:"Qual é a cor da tinta feita com a semente do urucum?",
 c:"Vermelha.",
 w:["Azul.","Verde.","Branca.","Preta."]},
{t:"ind",d:"d",apoio:"A vegetação do Morro da Tijuca, no Rio de Janeiro, quase foi extinta. Em 1861, D. Pedro II, o segundo imperador do Brasil, tomou algumas medidas.",
 q:"Qual solução D. Pedro II encontrou para preservar a vegetação do Morro da Tijuca?",
 c:"O reflorestamento, repondo árvores no local.",
 w:["O desmatamento de todo o morro.","A construção de um engenho de açúcar.","A venda da madeira para a Europa.","A construção de prédios no alto do morro."]},
{t:"ind",d:"d",apoio:"Em 1817, D. João VI se preocupou em proteger o Rio Carioca, que abastecia a cidade do Rio de Janeiro.",
 q:"Por que D. João VI quis proteger o Rio Carioca?",
 c:"Para que a população tivesse acesso à água potável.",
 w:["Para construir um porto de navios.","Para retirar pau-brasil das margens.","Para criar uma aldeia indígena.","Para que ninguém mais usasse a água."]},
{t:"ind",d:"m",q:"Assinale a alternativa <u>correta</u> sobre a relação entre as pessoas e a natureza.",
 c:"Existem maneiras sustentáveis de aproveitar os recursos naturais.",
 w:["Não ocorre desmatamento durante a construção de vilas e cidades.","Os colonizadores portugueses nunca modificaram a natureza.","A natureza só foi transformada nos dias de hoje.","Os indígenas não usam nenhum recurso da natureza."]},
{t:"ind",d:"f",q:"Alguns indígenas chamam seus animais silvestres de estimação, como macacos e araras, de:",
 c:"xerimbabo.",
 w:["maloca.","capulana.","quilombola.","moenda."]},
{t:"ind",d:"m",apoio:"Atualmente, os povos indígenas também domesticam gatos e cachorros.",
 q:"Qual destes animais <u>não existia</u> no Brasil antes da chegada dos europeus?",
 c:"Gato.",
 w:["Macaco.","Arara.","Porco-do-mato.","Jabuti."]},
{t:"ind",d:"m",q:"Quando os europeus chegaram, a costa litorânea era habitada por quais povos?",
 c:"Povos Tupi-Guarani, como os Tupinambá, os Tamoio e os Carijó.",
 w:["Povos Maori, da Nova Zelândia.","Povos banto e iorubá.","Povos mursi, da Etiópia.","Portugueses, holandeses e franceses."]},
{t:"ind",d:"d",q:"Por que a maior parte das vilas e cidades atuais está em locais que eram habitados por indígenas?",
 c:"Porque os europeus começaram a ocupar os espaços onde havia aldeias indígenas.",
 w:["Porque os indígenas construíram prédios nesses locais.","Porque os indígenas pediram aos europeus que fizessem cidades.","Porque nesses locais nunca houve floresta.","Porque os africanos escolheram esses lugares."]},
{t:"ind",d:"f",q:"Nas aldeias-escola, meninos e meninas indígenas compartilham conhecimentos. Isso ajuda a:",
 c:"manter as tradições do seu povo.",
 w:["esquecer a língua dos antepassados.","acabar com os rituais da aldeia.","construir engenhos de açúcar.","morar longe da família para sempre."]},
{t:"ind",d:"m",apoio:"Indígenas do Xingu dançam durante o ritual Kuarup.",
 q:"O que é o Kuarup?",

 w:["Um jogo de cabo de guerra.","Uma festa para comemorar a colheita do café.","Um tipo de moradia retangular.","Uma luta que foi proibida por lei."]},
{t:"ind",d:"f",q:"Hoje, muitos indígenas usam a internet e outras tecnologias. Como isso pode ajudar esses povos?",
 c:"A espalhar suas histórias, estudar e conhecer os próprios direitos.",
 w:["A esquecer as tradições dos antepassados.","A parar de falar a própria língua.","A deixar de viver em comunidade.","Não ajuda em nada, pois indígenas não podem usar tecnologia."]},
{t:"ind",d:"m",apoio:"Em uma fotografia de 1926, crianças Parintintin, da etnia Kagwahiva, ouvem música em um gramofone, no estado do Amazonas. O gramofone é um aparelho de som que tocava músicas gravadas em discos.",
 q:"Que local foi registrado nessa fotografia?",
 c:"Uma aldeia indígena.",
 w:["A cidade de São Paulo.","Uma vila portuguesa.","Um engenho de açúcar.","Um reino africano."]},
{t:"ind",d:"d",apoio:"Uma gravura de 1613, feita por dois artistas franceses, mostra indígenas Tupinambá com roupas europeias e acessórios da própria etnia.",
 q:"O que essa gravura nos ajuda a perceber?",
 c:"Que o contato com os europeus trouxe mudanças no modo de vida indígena.",
 w:["Que os indígenas nunca tiveram contato com os europeus.","Que os Tupinambá moravam na França desde sempre.","Que os europeus passaram a usar cocares todos os dias.","Que os indígenas não tinham acessórios próprios."]},

// ===== Capítulo 6: História e cultura africana =====
{t:"afr",d:"f",apoio:"Um engenheiro argelino construiu mais de 25 casas circulares feitas de plástico para pessoas refugiadas em um deserto da Argélia.",
 q:"Em qual continente fica a Argélia?",
 c:"África.",
 w:["América.","Europa.","Ásia.","Oceania."]},
{t:"afr",d:"f",q:"Refugiados são pessoas que:",
 c:"precisaram sair de seus países por causa de guerras, conflitos ou perseguições.",

{t:"afr",d:"m",apoio:"As casas de garrafas plásticas da Argélia isolam o calor intenso do deserto e resistem aos períodos de chuva.",
 q:"Qual foi um benefício dessa iniciativa?",

 w:["As garrafas foram jogadas no deserto.","As famílias tiveram de sair da Argélia.","As casas derretem com o calor do deserto.","As casas foram feitas só para turistas."]},
{t:"afr",d:"f",q:"Segundo uma lenda, o café foi descoberto em qual país africano?",
 c:"Etiópia.",
 w:["Egito.","Argélia.","Marrocos.","Brasil."]},
{t:"afr",d:"d",q:"Por que as primeiras cidades, como as do Egito, ficavam perto de rios?",
 c:"Porque o acesso à água facilitava cultivar alimentos e criar animais.",

{t:"afr",d:"m",apoio:"Os egípcios utilizavam pedras e barro para criar suas construções.",
 q:"Como os egípcios faziam tijolos?",
 c:"Misturavam argila com água e palha, moldavam e deixavam secar ao sol.",

{t:"afr",d:"m",q:"Muitos reinos da África eram formados por:",
 c:"um conjunto de aldeias, cidades e uma cidade principal.",
 w:["um conjunto de ilhas no meio do oceano.","uma única casa onde morava o rei.","engenhos de açúcar e senzalas.","aldeias indígenas do Brasil."]},
{t:"afr",d:"m",q:"A Universidade de Sancoré, uma das mais antigas do mundo, fica na cidade de Tombuctu. Em que país está essa cidade?",
 c:"Mali.",
 w:["Egito.","Etiópia.","Nigéria.","Portugal."]},

/* ---------- sorteio das letras (semente guardada para a prova e o gabarito baterem) ---------- */
const LET = ["A","B","C","D","E"];
function rng(seed){ let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(a, r){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function build(seed){
  const r = rng(seed);
  // 10 respostas em cada letra, em ordem sorteada
  const slots = shuffle([...Array(50)].map((_, i) => i % 5), r);
  return MC.map((q, i) => {
    const wrong = shuffle([...q.w], r);
    const opts = [...wrong]; opts.splice(slots[i], 0, q.c);
    return { ...q, opts, ans: slots[i] };
  });
}

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem("simhist3:" + k)); } catch { return null; } },
  set(k, v){ try { localStorage.setItem("simhist3:" + k, JSON.stringify(v)); } catch {} }
};

let seed = store.get("seed") || 3052;
let answers = store.get("answers") || {};
let texts = store.get("texts") || {};
let finished = store.get("finished") || false;
let quiz = build(seed);

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chips = q => `<span class="chip ${q.d}">${D[q.d]}</span><span class="chip t">${T[q.t]}</span>`;

function renderProva(){
  const main = $("#prova");
  let html = `<div class="section-title"><span class="num">1</span><h2>Múltipla escolha</h2></div>
    <p class="note">Leia com atenção e marque só uma alternativa em cada questão.</p><div class="wrap" style="gap:12px">`;
  quiz.forEach((q, i) => {
    const n = i + 1, picked = answers[n];
    let cls = "q";
    if (finished) cls += picked === q.ans ? " right" : " wrong";
    html += `<article class="${cls}${finished ? " done" : ""}" id="q${n}">
      <div class="qhead"><span class="qn">${n}</span>${chips(q)}</div>
      ${q.apoio ? `<div class="apoio"><b>Leia</b>${esc(q.apoio)}</div>` : ""}
      <p class="stem">${q.q}</p>
      <ul class="opts">${q.opts.map((o, k) => {
        let oc = "opt";
        if (finished && k === q.ans) oc += " is-correct";
        else if (finished && k === picked) oc += " is-wrong";
        return `<li><label class="${oc}"><input type="radio" name="m${n}" value="${k}" ${picked === k ? "checked" : ""} ${finished ? "disabled" : ""}><span class="letter">${LET[k]}</span><span>${esc(o)}</span></label></li>`;
      }).join("")}</ul>
      ${finished ? `<div class="feedback ${picked === q.ans ? "ok" : "bad"}">${picked === q.ans ? "Correto!" : picked == null ? `Sem resposta. A certa é a letra ${LET[q.ans]}.` : `A resposta certa é a letra ${LET[q.ans]}.`}</div>` : ""}
    </article>`;
  });
  html += `</div><div class="section-title pagebreak"><span class="num">2</span><h2>Questões para responder por escrito</h2></div>
    <p class="note">Responda com as suas palavras, com frases completas.</p><div class="wrap" style="gap:12px">`;
  DS.forEach((q, i) => {
    const n = 51 + i;
    html += `<article class="q" id="q${n}">
      <div class="qhead"><span class="qn">${n}</span>${chips(q)}</div>
      <label class="stem" for="t${n}">${esc(q.q)}</label>
      <textarea id="t${n}" data-n="${n}" rows="4">${esc(texts[n] || "")}</textarea>
      ${finished ? `<div class="expected"><b>Resposta esperada:</b> ${esc(q.r)}</div>` : ""}
    </article>`;
  });
  html += `</div>`;
  const got = quiz.filter((q, i) => answers[i + 1] === q.ans).length;
  const answered = Object.keys(answers).length;
  html += finished
    ? `<div class="score" style="margin-top:18px">
        <div><b>${got}/50</b><span>acertos na múltipla escolha</span></div>
        ${["f","m","d"].map(k => { const all = quiz.filter(q => q.d === k); const ok = all.filter(q => answers[quiz.indexOf(q) + 1] === q.ans).length; return `<div><b>${ok}/${all.length}</b><span>${D[k].toLowerCase()}</span></div>`; }).join("")}
      </div>
      <div class="finish no-print" style="margin-top:12px"><span>As questões 51 a 70 mostram a resposta esperada para um adulto conferir.</span><button type="button" class="tool" id="reset">Fazer de novo</button></div>`
    : `<div class="finish no-print" style="margin-top:18px"><span><b id="count">${answered}</b> de 50 questões de múltipla escolha respondidas</span><button type="button" class="tool primary" id="finish">Finalizar e corrigir</button></div>`;
  main.innerHTML = html;
}

function renderGabarito(){
  const byLetter = [0,0,0,0,0]; quiz.forEach(q => byLetter[q.ans]++);
  let html = `<div class="section-title"><span class="num">✓</span><h2>Gabarito · versão ${seed}</h2></div>
    <p class="note">Para o responsável. Cada nova versão sorteia de novo a letra das respostas, e o gabarito acompanha.</p>
    <div class="dist">${LET.map((l, i) => `<span>${l}: ${byLetter[i]}</span>`).join("")}</div>
    <div class="key"><table><thead><tr><th>Nº</th><th>Letra</th><th>Resposta</th><th>Nível</th></tr></thead><tbody>`;
  quiz.forEach((q, i) => { html += `<tr><td>${i + 1}</td><td class="ans">${LET[q.ans]}</td><td>${esc(q.c)}</td><td><span class="chip ${q.d}">${D[q.d]}</span></td></tr>`; });
  html += `</tbody></table></div><h3 style="margin-top:18px">Questões para responder por escrito</h3>
    <div class="key"><table><thead><tr><th>Nº</th><th>Resposta esperada</th><th>Nível</th></tr></thead><tbody>`;
  DS.forEach((q, i) => { html += `<tr><td>${51 + i}</td><td>${esc(q.r)}</td><td><span class="chip ${q.d}">${D[q.d]}</span></td></tr>`; });
  html += `</tbody></table></div>`;
  $("#gabarito").innerHTML = html;
}

function render(){ renderProva(); renderGabarito(); $("#versao").textContent = `· Versão ${seed}`; }

document.addEventListener("change", e => {
  const el = e.target;
  if (el.type === "radio" && el.name.startsWith("m")){
    answers[+el.name.slice(1)] = +el.value; store.set("answers", answers);
    const c = $("#count"); if (c) c.textContent = Object.keys(answers).length;
  }
});
document.addEventListener("input", e => {
  if (e.target.matches("textarea[data-n]")){ texts[e.target.dataset.n] = e.target.value; store.set("texts", texts); }
  if (e.target.matches(".fields input")) store.set("f:" + e.target.id, e.target.value);
});
["aluno","turma","data"].forEach(id => { const v = store.get("f:" + id); if (v) $("#" + id).value = v; });

document.addEventListener("click", e => {
  if (e.target.id === "finish"){
    finished = true; store.set("finished", true); renderProva();
    $("#prova").scrollIntoView({ behavior: "smooth" });
  }
  if (e.target.id === "reset"){
    answers = {}; texts = {}; finished = false;
    store.set("answers", answers); store.set("texts", texts); store.set("finished", false);
    renderProva(); window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

function tab(which){
  const g = which === "gabarito";
  $("#prova").hidden = g; $("#gabarito").hidden = !g;
  $("#tab-prova").setAttribute("aria-selected", String(!g));
  $("#tab-gabarito").setAttribute("aria-selected", String(g));
}
$("#tab-prova").addEventListener("click", () => tab("prova"));
$("#tab-gabarito").addEventListener("click", () => tab("gabarito"));

$("#shuffle").addEventListener("click", () => {
  seed = 1000 + Math.floor(Math.random() * 9000);
  answers = {}; finished = false;
  store.set("seed", seed); store.set("answers", answers); store.set("finished", false);
  quiz = build(seed); render();
});

// Imprimir só funciona fora do visualizador do Claude (arquivo aberto no navegador)
if (!window.claude){ const p = $("#print"); p.hidden = false; p.addEventListener("click", () => window.print()); }

// Dentro do Claude: botão para salvar este mesmo arquivo e abrir em qualquer lugar
const SOURCE = (() => {
  const doc = document.documentElement.cloneNode(true);
  doc.querySelectorAll("script:not(#app), meta[http-equiv]").forEach(n => n.remove());
  doc.querySelector("#prova").innerHTML = ""; doc.querySelector("#gabarito").innerHTML = "";
  return "<!doctype html>\n" + doc.outerHTML;
})();
if (window.claude?.use){
  claude.use("downloads").then(dl => {
    if (!dl) return;
    const b = $("#save"); b.hidden = false;
    b.addEventListener("click", () => dl.save({ filename: "simulado-historia-3ano.html", data: SOURCE }).catch(() => {}));
  }).catch(() => {});
}

render();
})();
